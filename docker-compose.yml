version: '3.9'

services:

  postgres:
    image: postgres:16

    container_name: signalnoise-postgres

    environment:
      POSTGRES_DB: signalnoise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  signalnoise-api:
    build: .
    container_name: signalnoise-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: